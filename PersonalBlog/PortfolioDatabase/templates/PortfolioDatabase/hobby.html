{% extends 'PortfolioDatabase/base.html' %}

{% block body %}
<h2>Hobbies</h2>

<ul class = "list-unstyled row row-cols-2 row-cols-md-3 g-4">
{% for hobby in hobbies %}
<li class = "col">
<div class = "card h-100">
<h3>{{hobby.hobby_name}}</h3>
<a href = "{{hobby.id}}"><img src = "{{hobby.hobby_image}}" width = "250px" class="card-img-top"></a>
</div>



</li>

{% endfor %}

</ul>

{% endblock %}
